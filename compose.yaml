services:
  postgres:
    image: postgres:16-alpine
    container_name: multiagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multiagent}
      POSTGRES_USER: ${POSTGRES_USER:-multiagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - multiagent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-multiagent} -d ${POSTGRES_DB:-multiagent}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  multiagent-postgres-data:
